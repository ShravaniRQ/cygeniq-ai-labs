services:
  - type: web
    name: cygeniq-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false   # Groq API key — paste in the Render dashboard

      - key: SUPABASE_URL
        sync: false   # postgresql://... connection string from Supabase

      - key: AZURE_TENANT_ID
        sync: false   # Azure AD Tenant ID for SharePoint MCP

      - key: AZURE_CLIENT_ID
        sync: false   # Azure App Registration Client ID

      - key: AZURE_CLIENT_SECRET
        sync: false   # Azure App Registration Client Secret

      - key: GMAIL_EMAIL
        sync: false   # Gmail account for Gmail MCP

      - key: GMAIL_APP_PASSWORD
        sync: false   # Google App Password (16 characters)

      - key: SECURITY_AUDIT_DB
        value: /app/data/security_simulator.db

      # Authentication: protect the /chat endpoint
      - key: CYGENIQ_API_KEY
        sync: false   # Internal API key for /chat — leave blank for open dev access

      - key: JWT_SECRET_KEY
        sync: false   # Secret key for RBAC JWT generation

      # Persistent memory storage
      - key: DATA_DIR
        value: /app/data

    healthCheckPath: /health
